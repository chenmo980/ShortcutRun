<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ShortcutRun 灰模 · 浏览器试玩版</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87a5c8; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #app { width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 50%; transform: translateX(-50%); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); user-select: none; pointer-events: none; }
  #brick { top: 18px; font-size: 26px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
  .brickIcon { width: 18px; height: 18px; background: #ffc107; border-radius: 3px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); display: inline-block; }
  #hint { top: 40%; font-size: 32px; font-weight: bold; text-align: center; }
  #progbar { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); width: 340px; height: 12px; background: rgba(0,0,0,.3); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #progfill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd54f, #ff8f00); border-radius: 6px; transition: width .12s linear; }
  #levelBadge { position: fixed; left: 16px; top: 14px; color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,.5); background: rgba(0,0,0,.25); padding: 4px 14px; border-radius: 20px; user-select: none; pointer-events: none; }
  /* 覆盖层：开始界面 / 结算面板 */
  .overlay { position: fixed; inset: 0; background: rgba(15, 25, 40, .55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }
  .panel { background: rgba(255,255,255,.96); border-radius: 20px; padding: 40px 56px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); min-width: 340px; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .title { font-size: 46px; font-weight: 900; color: #263238; letter-spacing: 2px; }
  .subtitle { font-size: 14px; color: #78909c; margin-top: 6px; }
  .bestline { font-size: 16px; color: #455a64; margin-top: 18px; }
  .goalline { font-size: 15px; color: #ef6c00; margin-top: 8px; font-weight: bold; }
  .btn { margin-top: 26px; font-size: 22px; font-weight: bold; color: #fff; background: linear-gradient(180deg, #66bb6a, #43a047); border: none; border-radius: 14px; padding: 14px 52px; cursor: pointer; box-shadow: 0 6px 0 #2e7d32, 0 8px 16px rgba(0,0,0,.25); transition: transform .08s ease; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2e7d32; }
  .help { margin-top: 22px; font-size: 13px; color: #90a4ae; line-height: 1.8; }
  .rtitle { font-size: 38px; font-weight: 900; color: #263238; }
  .rtitle.fail { color: #c62828; }
  .stars { font-size: 52px; letter-spacing: 8px; margin-top: 10px; color: #ffc107; text-shadow: 0 3px 8px rgba(255,143,0,.4); }
  .stars span { display: inline-block; animation: starPop .4s cubic-bezier(.2,1.6,.4,1) backwards; }
  .stars span:nth-child(2) { animation-delay: .15s; }
  .stars span:nth-child(3) { animation-delay: .3s; }
  @keyframes starPop { from { transform: scale(0) rotate(-60deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .rstats { margin-top: 16px; font-size: 16px; color: #455a64; line-height: 1.9; }
  /* 道具拾取/过门的飘字反馈 */
  #floaterHost { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); pointer-events: none; z-index: 5; }
  .floater { position: absolute; left: 0; transform: translateX(-50%); font-size: 30px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,.4); animation: floatUp .9s ease-out forwards; white-space: nowrap; }
  @keyframes floatUp { from { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } to { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
  #title { position: fixed; left: 14px; top: 12px; color: #fff; font-size: 14px; opacity: .85; text-shadow: 0 1px 4px rgba(0,0,0,.5); user-select: none; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="levelBadge">第 1 关</div>
<div id="charBadge" class="hud" style="left:14px; top:42px; cursor:pointer; background:rgba(15,23,42,0.7); border:1px solid rgba(255,255,255,0.25); border-radius:12px; padding:3px 10px; font-size:12px; font-weight:bold; color:#fff; display:flex; align-items:center; gap:4px; z-index:10; user-select:none;" title="点击或按 C 键切换国风角色预设">🐵 孙悟空 (按C换装)</div>
<div id="brick" class="hud"><span class="brickIcon"></span><span id="brickText">砖块 0</span></div>
<div id="progbar"><div id="progfill"></div></div>
<div id="hint" class="hud" style="display:none"></div>
<div id="floaterHost"></div>

<div id="startScreen" class="overlay">
  <div class="panel">
    <div class="title">铺路飞人</div>
    <div class="subtitle">Shortcut Run 玩法复刻 · 灰模试玩 v0.2</div>
    <div class="bestline" id="startBest">最高进度：第 1 关</div>
    <div class="goalline" id="startGoal"></div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="help">拖动鼠标 / A D 转向 · 吃砖铺路过断崖<br>T 场景换肤 · C 切换国风角色 · M 音效开关</div>
  </div>
</div>

<div id="resultScreen" class="overlay" style="display:none">
  <div class="panel">
    <div class="rtitle" id="resultTitle"></div>
    <div class="stars" id="resultStars"></div>
    <div class="rstats" id="resultStats"></div>
    <button class="btn" id="resultBtn"></button>
  </div>
</div>
<script src="three.min.js"></script>
<script>
// ============ 配置（与 Cocos 版 config.ts 一致） ============
const CFG = {
  runSpeed: 6, speedPerBrick: 0.08, maxSpeed: 10,
  steerSpeed: 10, steerPerPixel: 0.022, keySteerSpeed: 4,
  trackHalfWidth: 2.6,
  levelLength: 150, gapWidthMin: 2.5, gapWidthMax: 4.5,
  gapIntervalMin: 16, gapIntervalMax: 26,
  brickCluster: 4, gateCost: 14, brickUnit: 0.3,
  // 自由铺板捷径（原版核心机制）
  plankCostPerMeter: 1,  // 离开主路后每米消耗板子
  plankStride: 0.6,      // 每多少米留一块板（视觉）
  offRoadBoost: 1.15,    // 铺捷径加速倍率（赌板子换速度）
  plankPoolMax: 300,     // 板子视觉池上限
  camOffsetY: 6.8, camOffsetZ: -8.8, camLerp: 6, camXFactor: 0.6,
};

let cfg = { ...CFG }; // 按关卡切换（LevelCurve），全局代码只读 cfg
let levelNum = 1, attempt = 1, runT0 = 0;
let speedDip = 0; // 铺桥瞬间轻微减速（J4 手感，v3 起铺板改持续机制后停用）
let runCycle = 0, fell = false; // 角色动画相位 / 是否坠落死亡
let bridgeT = 0; // 铺桥推掷动作剩余时间（v2 增强）

// ===== 关卡推进（移植自 docs/qoder/progression.mjs 母本，localStorage 持久化） =====
const SR_KEY = 'shortcut_run_progress_v1';
const PAR = [16.5, 19.0, 19.5, 18.5, 19.5, 18.5, 19.5, 20.5, 20.5, 21.5];
const PAR_LOOP_SHIFT = 2.5; // 实测每 loop 胜局用时 +2.5~2.6s；L11+ 不补偿则三星恒不可达
function parFor(level) {
  return PAR[(level - 1) % PAR.length] + Math.floor((level - 1) / PAR.length) * PAR_LOOP_SHIFT;
}
function starsFor(level, t, bricksLeft) {
  return 1 + (bricksLeft >= 3 ? 1 : 0) + (t <= parFor(level) ? 1 : 0);
}
const prog = (() => {
  const fresh = () => ({ v: 1, level: 1, attempt: 1, wins: 0, best: {} });
  let s;
  try {
    const raw = localStorage.getItem(SR_KEY);
    s = raw ? JSON.parse(raw) : fresh();
    if (s.v !== 1 || !(s.level >= 1)) s = fresh();
  } catch { s = fresh(); } // 脏数据不让循环卡死
  const save = () => localStorage.setItem(SR_KEY, JSON.stringify(s));
  return {
    state: () => ({ ...s }),
    current: (cfgFn) => ({ level: s.level, seed: s.level * 1000 + s.attempt, cfg: cfgFn(s.level) }),
    win(t, bricksLeft) {
      const lv = s.level;
      const stars = starsFor(lv, t, bricksLeft);
      s.wins += 1;
      if (!s.best[lv] || t < s.best[lv].time) s.best[lv] = { time: +t.toFixed(2), stars };
      s.level = lv + 1; s.attempt = 1; save();
      return { nextLevel: s.level, stars, best: s.best[lv] };
    },
    lose() { s.attempt = Math.min(s.attempt + 1, 99); save(); return { level: s.level, seed: s.level * 1000 + s.attempt }; },
    reset() { s = fresh(); save(); },
  };
})();
function syncLevel() { buildLevel(prog.current((lv) => cfgForLevel(lv))); }

// ============ 关卡生成（与 Cocos 版 LevelGen.ts 一致，纯逻辑） ============
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function genLevel(seed, cfg, opts = {}) {
  const tailSafe = opts.tailSafe === true;
  const rnd = mulberry32(seed);
  const halfW = cfg.trackHalfWidth - 0.8;
  const gaps = [];
  let z = 8;
  while (z < cfg.levelLength - 14) {
    let width = cfg.gapWidthMin + rnd() * (cfg.gapWidthMax - cfg.gapWidthMin);
    if (tailSafe) {
      const room = cfg.levelLength - 14 - z;
      if (room < cfg.gapWidthMin) break;
      width = Math.min(width, room);
    }
    gaps.push({ zStart: z, zEnd: z + width, cost: Math.ceil(width) });
    z = z + width + cfg.gapIntervalMin + rnd() * (cfg.gapIntervalMax - cfg.gapIntervalMin);
  }
  const gateZ = cfg.levelLength - 6;
  const runZones = [];
  let prev = 0;
  for (const g of gaps) { runZones.push([prev, g.zStart]); prev = g.zEnd; }
  runZones.push([prev, gateZ - 2]);
  const pickups = [];
  for (const [z0, z1] of runZones) {
    if (z1 - z0 < 6) continue;
    const n = 1 + (rnd() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) pickups.push({ x: (rnd() * 2 - 1) * halfW, z: z0 + 2 + rnd() * Math.max(1, z1 - z0 - 4) });
  }
  const need = cfg.gateCost + gaps.reduce((s, g) => s + g.cost, 0);
  while (pickups.length * cfg.brickCluster < need) {
    const zone = runZones[Math.floor(rnd() * runZones.length)];
    if (!zone || zone[1] - zone[0] < 6) break;
    pickups.push({ x: (rnd() * 2 - 1) * halfW, z: zone[0] + 2 + rnd() * Math.max(1, zone[1] - zone[0] - 4) });
  }
  return { length: cfg.levelLength, gaps, pickups, gateZ, gateCost: cfg.gateCost };
}

// ===== v2/v3（移植自 docs/qoder/bridge-rules.mjs 母本） =====
// D1：v1 有 2.75% 关卡全局砖不足（数学不可通关）；D2：16.4% 前缀死局
// v3 = tailSafe（D1 几何根治）+ margin/k 双目标供给修复 + 拾取 z 摊开
function zonesOf(level) {
  const zones = [];
  let prev = 0;
  for (const g of level.gaps) { zones.push([prev, g.zStart]); prev = g.zEnd; }
  zones.push([prev, level.gateZ]);
  return zones;
}
function prefixBalance(level, cfg) {
  const zones = zonesOf(level);
  const perZone = zones.map(([z0, z1]) => level.pickups.filter((p) => p.z >= z0 && p.z < z1).length * cfg.brickCluster);
  const surplus = [];
  let acc = 0;
  for (let i = 0; i < level.gaps.length; i++) { acc += perZone[i] - level.gaps[i].cost; surplus.push(acc); }
  acc += perZone[perZone.length - 1] - level.gateCost;
  surplus.push(acc);
  const minSurplus = Math.min(...surplus);
  return { perZone, surplus, feasible: surplus.every((s) => s >= 0), minSurplus, minAt: surplus.indexOf(minSurplus) };
}
function chooseZoneToFix(zones, badGapIdx) {
  for (let i = badGapIdx; i >= 0; i--) { if (zones[i][1] - zones[i][0] >= 6) return i; }
  return -1;
}
function repairPrefixSupply(level, cfg, seed, margin, k = 1) {
  const zones = zonesOf(level);
  let guard = 0;
  while (guard++ < 500) {
    const { surplus, perZone } = prefixBalance(level, cfg);
    const demand = [];
    let d = 0;
    for (const g of level.gaps) { d += g.cost; demand.push(d); }
    demand.push(d + level.gateCost);
    const supply = [];
    let acc = 0;
    for (let i = 0; i < perZone.length; i++) { acc += perZone[i]; supply.push(acc); }
    let bad = -1;
    for (let i = 0; i < surplus.length; i++) {
      if (surplus[i] < margin || supply[i] < k * demand[i] - 1e-9) { bad = i; break; }
    }
    if (bad === -1) break;
    const zoneIdx = chooseZoneToFix(zones, bad);
    if (zoneIdx < 0) break;
    const [z0, z1] = zones[zoneIdx];
    const rnd = mulberry32(seed * 7919 + guard);
    level.pickups.push({ x: (rnd() * 2 - 1) * (cfg.trackHalfWidth - 0.8), z: z0 + 2 + rnd() * Math.max(1, z1 - z0 - 4) });
  }
}
function spaceOutPickups(level, zones, minGap = 4) {
  for (const [z0, z1] of zones) {
    const inZone = level.pickups.filter((p) => p.z >= z0 && p.z < z1).sort((a, b) => a.z - b.z);
    if (inZone.length < 2) continue;
    const lo = z0 + 1, hi = z1 - 1;
    if (hi - lo < minGap * (inZone.length - 1)) {
      for (let i = 0; i < inZone.length; i++) inZone[i].z = lo + ((hi - lo) * i) / (inZone.length - 1);
      continue;
    }
    for (let i = 1; i < inZone.length; i++) inZone[i].z = Math.max(inZone[i].z, inZone[i - 1].z + minGap);
    if (inZone[inZone.length - 1].z > hi) {
      inZone[inZone.length - 1].z = hi;
      for (let i = inZone.length - 2; i >= 0; i--) inZone[i].z = Math.min(inZone[i].z, inZone[i + 1].z - minGap);
    }
  }
}
function genLevelV3(seed, cfg, opts = {}) {
  const margin = opts.margin ?? cfg.supplyMargin ?? 2;
  const k = opts.supplyRatio ?? cfg.supplyRatio ?? 1;
  const level = genLevel(seed, cfg, { tailSafe: true });
  repairPrefixSupply(level, cfg, seed, margin, k);
  spaceOutPickups(level, zonesOf(level));
  // v4 道具开关（移植自母本/TS 版，§14/§21 parity 锚）：opts.items 显式传入，或
  // cfg.enableItems 走 ITEMS_DEFAULT。**默认关闭 = 输出与 v3 逐字节一致**；
  // 开启时仅追加 level.gates 与 kind:'shoe' 拾取（供需数学按 !kind 过滤 = 纯增益）
  const items = opts.items ?? (cfg.enableItems ? ITEMS_DEFAULT : null);
  if (items) placeItems(level, cfg, seed, items);
  return level;
}
const ITEMS_DEFAULT = { addGates: 1, mulGates: 1, shoes: 1 };
// 道具布置（独立子种子 mulberry32(seed*104729+7)，确定性）：门放可跑区间内、
// 避开断崖与彼此；鞋作为 kind:'shoe' 拾取追加。放不下的名额直接放弃（计数 <= 计划）。
function placeItems(level, cfg, seed, plan) {
  const rnd = mulberry32(seed * 104729 + 7);
  const zones = zonesOf(level);
  const gates = [];
  const putGate = (type, v, from, to) => {
    for (let tries = 0; tries < 40; tries++) {
      const z = from + rnd() * (to - from);
      const onTrack = zones.some(([z0, z1]) => z > z0 + 1.5 && z < z1 - 1.5);
      const clear = gates.every((g) => Math.abs(g.z - z) >= 6);
      if (onTrack && clear) {
        gates.push({ z: +z.toFixed(2), type, v });
        return;
      }
    }
  };
  const gateZ = level.gateZ;
  for (let i = 0; i < (plan.addGates ?? 0); i++) putGate('add', plan.addValue ?? 5, gateZ * 0.45, gateZ * 0.8);
  for (let i = 0; i < (plan.mulGates ?? 0); i++) putGate('mul', plan.mulValue ?? 2, gateZ * 0.55, gateZ * 0.85);
  gates.sort((a, b) => a.z - b.z);
  level.gates = gates;
  const shoeZones = zones.filter(([z0, z1]) => z1 - z0 >= 6);
  for (let i = 0; i < (plan.shoes ?? 0); i++) {
    if (!shoeZones.length) break;
    const [z0, z1] = shoeZones[Math.floor(rnd() * shoeZones.length)];
    level.pickups.push({
      x: +((rnd() * 2 - 1) * (cfg.trackHalfWidth - 0.8)).toFixed(2),
      z: +(z0 + 2 + rnd() * Math.max(1, z1 - z0 - 4)).toFixed(2),
      kind: 'shoe',
    });
  }
}

// ===== 关卡进阶曲线（移植自 docs/qoder/levels.mjs） =====
const CURVE = [
  [120, 10, 2.5, 4.0, 18, 28, 6.0, 10.0, 0.08],
  [140, 12, 2.5, 4.5, 16, 26, 6.0, 10.0, 0.08],
  [150, 14, 2.6, 4.8, 15, 25, 6.0, 10.0, 0.08],
  [160, 15, 2.7, 5.0, 14, 23, 6.5, 10.5, 0.09],
  [170, 16, 2.8, 5.3, 13, 22, 6.5, 11.0, 0.09],
  [180, 18, 3.0, 5.5, 12, 20, 7.0, 11.0, 0.10],
  [190, 20, 3.2, 5.7, 11, 19, 7.0, 11.5, 0.10],
  [200, 22, 3.4, 6.0, 10, 17, 7.0, 12.0, 0.10],
  [210, 24, 3.5, 6.0, 10, 16, 7.5, 12.0, 0.11],
  [220, 26, 3.5, 6.0, 10, 16, 7.5, 12.0, 0.11],
];
function marginFor(level) { const l = ((Math.max(1, level) - 1) % 10) + 1; return l <= 3 ? 4 : l <= 7 ? 2 : 1; }
function ratioFor(level) { const l = ((Math.max(1, level) - 1) % 10) + 1; return l <= 3 ? 2.0 : l <= 7 ? 1.8 : 1.55; }
// 弯道曲线（我方表现层扩展，母本无此字段；L1-3 直道，之后渐弯——原版 Shortcut Run 的 S 弯）
function curveFor(level) {
  const l = ((Math.max(1, level) - 1) % 10) + 1;
  if (l <= 3) return { curveAmp: 0, curveFreq: 0.12, curvePhase: 0 };
  return { curveAmp: l <= 6 ? 2.2 : 3.2, curveFreq: 0.12, curvePhase: level * 1.7 };
}
function cfgForLevel(level) {
  const idx = (Math.max(1, level) - 1) % CURVE.length;
  const loop = Math.floor((Math.max(1, level) - 1) / CURVE.length);
  const [length, gateCost, gwMin, gwMax, giMin, giMax, runSpeed, maxSpeed, speedPerBrick] = CURVE[idx];
  // 与 docs/qoder/levels.mjs 母本同步（2026-09-21 饱和版）：加深 2 loop 封顶 + k 地板 1.5，
  // 旧线性版实测 L28+ 人形胜率 3~13% 死亡墙。漂移由 docs/qoder/sim.mjs §15 回归锁看守
  const f = 1 + Math.min(loop, 1) * 0.1;
  return {
    ...CFG,
    levelLength: length + loop * 20,
    gateCost: Math.round(gateCost * f * f),
    gapWidthMin: Math.min(4.5, gwMin * f),
    gapWidthMax: Math.min(7.0, gwMax * f),
    gapIntervalMin: Math.max(6, giMin / f),
    gapIntervalMax: Math.max(10, giMax / f),
    runSpeed, maxSpeed, speedPerBrick,
    supplyMargin: marginFor(level),
    supplyRatio: Math.max(1.5, ratioFor(level) - loop * 0.1),
    ...curveFor(level), // 弯道（表现层，L1-3 直道）
  };
}
// v4 道具分带（移植自 docs/qoder/levels.mjs itemsFor）：L1-2 教学关无道具；
// L3 起 +N 门；L4 起 ×2 门；L6 起加速鞋；loop 微增封顶。null = 本关无道具
function itemsFor(level) {
  const l = ((Math.max(1, level) - 1) % 10) + 1;
  const loop = Math.floor((Math.max(1, level) - 1) / 10);
  if (l <= 2) return null;
  return {
    addGates: 1 + Math.min(loop, 1),
    mulGates: (l >= 4 ? 1 : 0) + (loop >= 2 ? 1 : 0),
    shoes: (l >= 6 ? 1 : 0) + Math.min(loop, 2),
    addValue: 5,
    mulValue: 2,
  };
}

// ============ 三维场景 ============
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; // art-pack PCFSoft：仅主角/板堆投影、路面接收（微信 1024 线）
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a5c8);
scene.fog = new THREE.FogExp2(0x87a5c8, 0.007); // art-pack FogExp2(sky, 0.007)

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);

function box(mat, sx, sy, sz, x, y, z, parent) {
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  if (parent) { m.castShadow = true; parent.add(m); }
  else { m.receiveShadow = true; scene.add(m); } // art-pack：路面接收，不投影
  return m;
}

// ===== 弯道（表现层：level-space z → 世界位置；LevelGen 数据不变，parity 锁不破） =====
// 参考原版 Shortcut Run 的 S 弯：中路正弦弯曲，朝向=切线角，物体随弯道排布
const curve = { amp: 0, freq: 0.12, phase: 0 };
function bendX(z) { return curve.amp * Math.sin(z * curve.freq + curve.phase); }
function bendDx(z) { return curve.amp * curve.freq * Math.cos(z * curve.freq + curve.phase); }
function headingAt(z) { return Math.atan(bendDx(z)); }
// 关卡空间盒：位置/朝向随弯道；sz 按斜率做斜切补偿避免漏缝
function levelBox(mat, sx, sy, sz, x, y, z) {
  const h = headingAt(z);
  const len = sz / Math.max(0.75, Math.cos(h));
  const m = box(mat, sx, sy, len, bendX(z) + x * Math.cos(h), y, z);
  m.rotation.y = h;
  return m;
}
// 关卡空间组（道具门/加速鞋等复合体）
function levelGroup(x, y, z) {
  const g = new THREE.Group();
  g.position.set(bendX(z) + x * Math.cos(headingAt(z)), y, z);
  g.rotation.y = headingAt(z);
  scene.add(g);
  return g;
}

// ===== 音效（WebAudio 代码合成，零素材；Cocos 版待音频文件阶段） =====
let audioCtx = null, muted = false;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* 无音频环境 */ } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
  if (!audioCtx || muted) return;
  try {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* 忽略音频错误 */ }
}

};

function cycleSkin() {
  const keys = Object.keys(SKINS);
  const nextIdx = (keys.indexOf(currentSkinKey) + 1) % keys.length;
  currentSkinKey = keys[nextIdx];
  applySkin(char, currentSkinKey);
  return currentSkinKey;
}

// 动画（移植自母本 animateCharacter）：跑步步态/前倾/转弯侧倾/头带飘动/胜利/落水
function animateChar(char, runCycle, steerVelocity, carriedPlanks, state, delta, pickupPulse = 0) {
  if (!char || !char.root || !char.torso || !char.head || !char.headbandRibbon || !char.plankMount || !char.leftArm || !char.leftArm.shoulder || !char.leftArm.elbow || !char.rightArm || !char.rightArm.shoulder || !char.rightArm.elbow || !char.leftLeg || !char.leftLeg.hip || !char.leftLeg.knee || !char.leftLeg.foot || !char.rightLeg || !char.rightLeg.hip || !char.rightLeg.knee || !char.rightLeg.foot) return; // Polle clone missing joints
  const lerp = (a, b, t) => a + (b - a) * Math.min(1, Math.max(0, t));
  if (state === 'drowned') {
    char.root.rotation.x = lerp(char.root.rotation.x, Math.PI / 2, delta * 5);
    char.root.rotation.z = lerp(char.root.rotation.z, 0.6, delta * 4);
    char.torso.position.y = lerp(char.torso.position.y, -0.8, delta * 3);
    return;
  }
  if (state === 'finished') {
    char.torso.rotation.x = lerp(char.torso.rotation.x, -0.15, delta * 5);
    char.torso.rotation.z = 0;
    char.torso.position.y = 0.72 + Math.abs(Math.sin(runCycle * 4)) * 0.25;
    char.leftArm.shoulder.rotation.x = lerp(char.leftArm.shoulder.rotation.x, -2.8, delta * 6);
    char.leftArm.shoulder.rotation.z = lerp(char.leftArm.shoulder.rotation.z, -0.4, delta * 6);
    char.rightArm.shoulder.rotation.x = lerp(char.rightArm.shoulder.rotation.x, -2.8, delta * 6);
    char.rightArm.shoulder.rotation.z = lerp(char.rightArm.shoulder.rotation.z, 0.4, delta * 6);
    char.leftLeg.hip.rotation.x = 0; char.rightLeg.hip.rotation.x = 0;
    char.leftLeg.knee.rotation.x = 0.1; char.rightLeg.knee.rotation.x = 0.1;
    return;
  }
  const stride = Math.sin(runCycle);
  // 负重反作用平衡（v2 增强）：搬得越多躯干抗压后仰、手臂内收、砖垛甩尾更重
  const loadFactor = Math.min(carriedPlanks / 25, 1.0);
  char.torso.rotation.x = 0.18 - loadFactor * 0.08;
  char.torso.rotation.y = Math.sin(runCycle) * 0.08;
  char.torso.rotation.z = lerp(char.torso.rotation.z, -steerVelocity * 0.32, delta * 12);
  char.torso.position.y = 0.72 + Math.abs(stride) * 0.12;
  char.head.rotation.x = -char.torso.rotation.x * 0.8;
  char.head.rotation.y = -char.torso.rotation.y * 0.5;
  char.headbandRibbon.rotation.x = -0.35 + Math.sin(runCycle * 2.5) * 0.22;
  char.headbandRibbon.rotation.y = Math.cos(runCycle * 2) * 0.15;
  // 额外国风饰品动力学（翎毛/发带/混天绫随风摆动）
  if (char.head) {
    const plumeL = char.head.getObjectByName('PlumeL');
    const plumeR = char.head.getObjectByName('PlumeR');
    if (plumeL && plumeR) {
      const pw = Math.sin(runCycle * 2.8) * 0.15;
      plumeL.rotation.x = -0.65 + pw;
      plumeR.rotation.x = -0.65 + pw;
    }
  }
  if (char.torso) {
    const silkL = char.torso.getObjectByName('SilkL');
    const silkR = char.torso.getObjectByName('SilkR');
    if (silkL && silkR) {
      const sw = Math.sin(runCycle * 2.6) * 0.25;
      silkL.rotation.x = -0.4 + sw;
      silkR.rotation.x = -0.4 + sw;
    }
  }
  char.leftLeg.hip.rotation.x = stride * 0.82;
  char.leftLeg.knee.rotation.x = stride > 0 ? 0.1 : Math.max(0, -stride * 1.35);
  char.rightLeg.hip.rotation.x = -stride * 0.82;
  char.rightLeg.knee.rotation.x = -stride > 0 ? 0.1 : Math.max(0, stride * 1.35);
  // 脚踝滚动（v2 增强）：前摆脚跟触地仰 +0.28，后摆脚尖蹬地 -0.45
  const footRollL = stride > 0 ? (stride > 0.4 ? 0.28 : -0.1) : -stride * 0.45;
  const footRollR = -stride > 0 ? (-stride > 0.4 ? 0.28 : -0.1) : stride * 0.45;
  char.leftLeg.foot.rotation.x = lerp(char.leftLeg.foot.rotation.x, footRollL, delta * 16);
  char.rightLeg.foot.rotation.x = lerp(char.rightLeg.foot.rotation.x, footRollR, delta * 16);
  // 铺桥推掷（v2 增强）：bridging 状态下双臂高频下推
  const bridgeThrust = state === 'bridging' ? Math.sin(runCycle * 3.5) * 0.22 : 0;
  const pickupPhase = Math.sin(Math.min(1.0, pickupPulse) * Math.PI);
  if (carriedPlanks > 0 || pickupPulse > 0.04) {
    // 左手：始终环抱、紧扣胸前砖垛（单手抱住物品）
    char.leftArm.shoulder.rotation.x = 0.65 + Math.sin(runCycle) * 0.04 + bridgeThrust;
    char.leftArm.shoulder.rotation.z = 0.38 + loadFactor * 0.1;
    char.leftArm.shoulder.rotation.y = -0.32;
    char.leftArm.elbow.rotation.x = -1.48 + bridgeThrust * 0.4;

    // 右手：拾取时大幅侧向下探捞拾动作（背后视角一览无余）
    if (pickupPulse > 0.02) {
      const isReaching = pickupPulse > 0.45;
      const reachProgress = isReaching ? (1.0 - pickupPulse) / 0.55 : pickupPulse / 0.45;
      const wideSpread = lerp(-0.22, -1.15, reachProgress);
      const pitchForward = lerp(0.48, 1.42, reachProgress);
      const armStraighten = lerp(-1.25, -0.2, reachProgress);
      char.rightArm.shoulder.rotation.x = pitchForward;
      char.rightArm.shoulder.rotation.y = lerp(0.22, -0.35, reachProgress);
      char.rightArm.shoulder.rotation.z = wideSpread;
      char.rightArm.elbow.rotation.x = armStraighten;
    } else if (carriedPlanks > 0) {
      char.rightArm.shoulder.rotation.x = 0.48 - Math.sin(runCycle) * 0.08 + bridgeThrust;
      char.rightArm.shoulder.rotation.z = -0.22 - loadFactor * 0.08;
      char.rightArm.shoulder.rotation.y = 0.22;
      char.rightArm.elbow.rotation.x = -1.22 + bridgeThrust * 0.5;
    } else {
      char.rightArm.shoulder.rotation.x = stride * 0.8;
      char.rightArm.shoulder.rotation.z = -0.15;
      char.rightArm.shoulder.rotation.y = 0;
      char.rightArm.elbow.rotation.x = -0.6;
    }
  } else {
    char.leftArm.shoulder.rotation.x = -stride * 0.8;
    char.leftArm.shoulder.rotation.z = 0.15;
    char.leftArm.shoulder.rotation.y = 0;
    char.leftArm.elbow.rotation.x = -0.6;
    char.rightArm.shoulder.rotation.x = stride * 0.8;
    char.rightArm.shoulder.rotation.z = -0.15;
    char.rightArm.shoulder.rotation.y = 0;
    char.rightArm.elbow.rotation.x = -0.6;
  }
  // 砖垛惯性：越重甩尾越猛（v2 增强）
  const inertia = 0.4 + loadFactor * 0.4;
  char.plankMount.rotation.z = lerp(char.plankMount.rotation.z, -steerVelocity * inertia, delta * 10);
  char.plankMount.rotation.x = 0.04 + Math.sin(runCycle * 2) * 0.04;
}
let level, state = 'ready', bricks = 0, speed = cfg.runSpeed, pickupPulse = 0;
let playerX = 0, targetX = 0, playerY = 0, fallVel = 0;
let pickups = [], gateWalls = [], stackMeshes = [], anims = [];
let curSeed = 1, shoeT = 0, itemMeshes = []; // v4：本局种子 / 加速鞋剩余时间 / 道具专属网格（plane 等，需显式清理）
let camInited = false;
for (let i = 0; i < 12; i++) {
  const s = cfg.brickUnit * 0.85;
  const m = box(MAT.brick, s, s, s, 0, 0.08 + i * s * 0.92, 0.04, char.plankMount); // 头顶砖垛（挂 torso 下，随身体动）
  m.visible = false;
  stackMeshes.push(m);
}

function buildLevel(cur) {
  levelNum = cur.level;
  cfg = cur.cfg;
  curSeed = cur.seed;
  // 弯道参数（来自 LevelCurve 的逐关曲线；amp=0 即直道）
  curve.amp = cfg.curveAmp ?? 0;
  curve.freq = cfg.curveFreq ?? 0.12;
  curve.phase = cfg.curvePhase ?? 0;
  level = genLevelV3(cur.seed, cfg, { items: itemsFor(cur.level) ?? undefined });
  // 清掉上一局动态物体（保留 player / stack / 灯光）；道具专属网格先显式清
  for (const m of itemMeshes) scene.remove(m);
  itemMeshes = [];
  for (let i = scene.children.length - 1; i >= 0; i--) {
    const o = scene.children[i];
    if (o.geometry === BOX && o !== player && !stackMeshes.includes(o)) scene.remove(o);
  }
  // 地面
  box(MAT.ground, 60, 0.4, cfg.levelLength + 80, 0, -0.6, cfg.levelLength / 2 - 10);

  pickups = []; gateWalls = []; anims = [];
  const w = cfg.trackHalfWidth * 2 + 0.6;
  // 跑道（按断崖分段）
  let z = 0;
  for (const g of level.gaps) { road(z, g.zStart, w); z = g.zEnd; }
  road(z, level.gateZ, w);
  // 拾取（kind:'shoe' 渲染成小鞋，其余为砖簇）
  for (const p of level.pickups) {
    if (p.kind === 'shoe') {
      const g = levelGroup(p.x, 0.05, p.z);
      const sole = new THREE.Mesh(BOX, MAT.shoe);
      sole.scale.set(0.5, 0.14, 0.26); sole.position.set(0, 0.07, 0); g.add(sole);
      const top = new THREE.Mesh(BOX, MAT.shoe);
      top.scale.set(0.3, 0.2, 0.24); top.position.set(-0.08, 0.24, 0); g.add(top);
      g.rotation.y = 0.6;
      itemMeshes.push(g);
      pickups.push({ mesh: g, def: p, taken: false });
    } else {
      const s = cfg.brickUnit;
      const m = levelBox(MAT.brick, s, s, s, p.x, s / 2 + 0.05, p.z);
      pickups.push({ mesh: m, def: p, taken: false });
    }
  }
  // 终点门
  const wallW = (cfg.trackHalfWidth * 2) / 3;
  for (let i = -1; i <= 1; i++) gateWalls.push(levelBox(MAT.gate, wallW, 1.4, 0.4, i * wallW, 0.7, level.gateZ));
  for (const sx of [-1, 1]) levelBox(MAT.pillar, 0.5, 2.8, 0.5, sx * (cfg.trackHalfWidth + 0.35), 1.4, level.gateZ);
  gapWarnings(level.gaps, cfg.trackHalfWidth * 2 + 0.6); // J2：断崖警示条纹
  buildProps(cur.seed);                                   // J2：两侧建筑群
  // v4 道具拱门：横跨跑道的横梁 + 白色大字（+N 蓝底 / ×2 红底，照原版）
  if (level.gates) {
    for (const g of level.gates) {
      const pw = cfg.trackHalfWidth + 0.35;
      levelBox(MAT.pillar, 0.4, 2.4, 0.4, -pw, 1.2, g.z);
      levelBox(MAT.pillar, 0.4, 2.4, 0.4, pw, 1.2, g.z);
      levelBox(ITEM_MAT[g.type], pw * 2 + 0.4, 0.7, 0.35, 0, 2.55, g.z);
      const txt = textPlane(g.type === 'add' ? `+${g.v}` : `×${g.v}`, 1.6, 0.62);
      txt.position.set(bendX(g.z), 2.55, g.z - 0.2);
      txt.rotation.y = Math.PI - headingAt(g.z); // 面向来向，随弯道切线
      scene.add(txt);
      itemMeshes.push(txt);
    }
  }

  // 玩家与状态复位（原地重建必须显式重置，否则从旧位置起步）
  state = 'ready'; bricks = 0; speed = cfg.runSpeed; shoeT = 0;
  playerX = 0; targetX = 0; playerY = 0; fallVel = 0;
  heldLeft = false; heldRight = false; dragging = false;
  fell = false; bridgeT = 0;
  offRoad = false; plankAcc = 0; leapGrace = 0;
  buildOpponents(); // AI 对手竞速（原版机制）
  player.position.set(bendX(0), 0, 0);
  player.rotation.set(0, 0, 0);
  for (const m of stackMeshes) m.visible = false;
  camInited = false;
  setBricksUI(0);
  setProgressUI(0, level.gateZ);
  resultScreen.style.display = 'none';
  showStart();
  console.log(`[ShortcutRun] 第 ${cur.level} 关 (seed ${cur.seed}) 断崖=${level.gaps.length} 拾取=${level.pickups.length} 终点z=${level.gateZ.toFixed(1)} 门需求=${cfg.gateCost}`);
}
function road(z0, z1, w) {
  // 弯道：道路按 2m 块随弯道排布（直道时块间无缝）
  const CH = 2;
  for (let zz = z0; zz < z1 - 0.1; zz += CH) {
    const len = Math.min(CH, z1 - zz);
    levelBox(MAT.road, w, 0.4, len, 0, -0.2, zz + len / 2);
    for (const sx of [-1, 1]) {
      levelBox(MAT_FIX.edge, 0.12, 0.08, len - 0.2, sx * (w / 2 - 0.12), 0.02, zz + len / 2);
    }
  }
}
// 断崖警示条纹（提前 1.5m 告诉玩家“前面没路”）
function gapWarnings(gaps, w) {
  for (const g of gaps) {
    for (let i = 0; i < 3; i++) {
      levelBox(i % 2 === 0 ? MAT_FIX.warn1 : MAT_FIX.warn2, w - 0.4, 0.06, 0.4, 0, 0.03, g.zStart - 1.3 + i * 0.42);
    }
  }
}
// 两侧建筑群（主题色，seed 确定，纯视觉纵深）
function buildProps(seed) {
  const rnd = mulberry32(seed * 31 + 7);
  const n = 26;
  for (let i = 0; i < n; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const z = 3 + (i / n) * (level.gateZ - 6);
    const h = 2.5 + rnd() * 7;
    const w = 1.5 + rnd() * 2;
    levelBox(rnd() < 0.5 ? MAT.building1 : MAT.building2, w, h, w, side * (6.5 + rnd() * 8), h / 2 - 0.5, z);
  }
}

const TELEMETRY_KEY = 'sr_telemetry_v1';
let qaSession = false; // restart()/QA 后门发起的局带 qa:true，telemetry-report 直剔（Qoder 去重双保险）
function pushEvent(ev) {
  try {
    const arr = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '[]');
    if (!Array.isArray(arr)) return;
    arr.push({ ...ev, ...(qaSession ? { qa: true } : {}), ts: Date.now() });
    if (arr.length > 500) arr.splice(0, arr.length - 500); // 封顶防无限膨胀
    localStorage.setItem(TELEMETRY_KEY, JSON.stringify(arr));
  } catch (e) { /* 遥测失败不影响游戏 */ }
}

// ============ 动画（极简 tween） ============
function tweenTo(obj, prop, to, dur, onDone) { anims.push({ obj, prop, from: obj[prop], to, t: 0, dur, onDone }); }
function stepAnims(dt) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i];
    a.t += dt;
    const k = Math.min(1, a.t / a.dur);
    a.obj[a.prop] = a.from + (a.to - a.from) * k;
    if (k >= 1) { anims.splice(i, 1); a.onDone && a.onDone(); }
  }
}

// ============ 核心逻辑（与 Cocos 版 GameApp.ts 一致，含扫掠检测） ============
function startRun() {
  if (state === 'ready') { state = 'run'; runT0 = elapsed; hideHint(); console.log('[ShortcutRun] GO!'); }
}
function enterFall() {
  console.log('[ShortcutRun] 砖不够，掉落！');
  showHint('掉落！');
  state = 'fall'; fallVel = 1;
  fell = true;
  slowT = 0.55;  // 失败慢动作
  shake(0.18, 0.2);
}
function win() {
  state = 'win';
  const t = Math.max(0, elapsed - runT0);
  const r = prog.win(t, bricks);
  sfx.win();
  pushEvent({ level: levelNum, seed: curSeed, outcome: 'win', t: +t.toFixed(2), bricksLeft: bricks, failZ: null, pickupsTotal: level.pickups.length });
  for (const w of gateWalls) tweenTo(w.position, 'y', -2.2, 0.4);
  const y0 = player.position.y;
  tweenTo(player.position, 'y', y0 + 0.7, 0.25, () => tweenTo(player.position, 'y', y0, 0.25));
  const b = prog.state().best[levelNum];
  showResult(true, `第 ${levelNum} 关通过！`, r.stars,
    `用时 ${t.toFixed(1)}s · 余砖 ${bricks}<br>本关最佳 ${b.stars}★ ${b.time}s`,
    '下一关', () => { resultScreen.style.display = 'none'; syncLevel(); });
  console.log(`[ShortcutRun] WIN 第 ${levelNum} 关 ${t.toFixed(1)}s 余砖 ${bricks} ${r.stars}星！（进度已存档）`);
}
function lose(reason) {
  if (state === 'lose') return;
  state = 'lose';
  showHint(reason);
  sfx.lose();
  pushEvent({ level: levelNum, seed: curSeed, outcome: 'lose', t: +(elapsed - runT0).toFixed(2), bricksLeft: bricks, failZ: +player.position.z.toFixed(1), pickupsTotal: level.pickups.length });
  prog.lose(); // 同关换图：attempt++（母本 progression.mjs 规则）
  const b = prog.state().best[levelNum];
  setTimeout(() => {
    if (state !== 'lose') return; // 期间被 restart 等打断则不弹
    showResult(false, '挑战失败', 0,
      `${reason}<br>本关最佳 ${b ? b.stars + '★ ' + b.time + 's' : '暂无'}`,
      '换图重试', () => { resultScreen.style.display = 'none'; syncLevel(); });
  }, 700); // 等掉落动画演完再弹面板
  console.log(`[ShortcutRun] LOSE: ${reason}. 换图重试第 ${levelNum} 关`);
}
// 吃板粒子（art-pack）：Box 碎片+重力，上限 24
const particles = [];
function spawnPickupBurst(wx, wy, wz, mat) {
  const n = Math.min(8, 24 - particles.length);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(BOX, mat);
    const sc = 0.12 + Math.random() * 0.14;
    m.scale.set(sc, sc, sc);
    m.position.set(wx + (Math.random() - 0.5) * 0.4, wy + Math.random() * 0.3, wz + (Math.random() - 0.5) * 0.4);
    m.castShadow = false;
    scene.add(m);
    particles.push({
      m, life: 0.55 + Math.random() * 0.25,
      vx: (Math.random() - 0.5) * 3.5, vy: 2.5 + Math.random() * 2.5, vz: (Math.random() - 0.5) * 3.5,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.vy -= 12 * dt;
    p.m.position.x += p.vx * dt;
    p.m.position.y += p.vy * dt;
    p.m.position.z += p.vz * dt;
    if (p.life <= 0 || p.m.position.y < -0.5) {
      scene.remove(p.m);
      particles.splice(i, 1);
    }
  }
}
function checkPickups(x, prevZ, z) {
  for (const p of pickups) {
    if (p.taken) continue;
    const hitZ = z >= p.def.z - 0.7 && prevZ <= p.def.z + 0.7;
      if (hitZ && Math.abs(x - p.def.x) < 0.95) {
        p.taken = true;
        p.mesh.visible = false;
        if (p.def.kind === 'shoe') {

          shoeT = 3.5;

        } else {
          bricks += cfg.brickCluster;
          pickupPulse = 1.0;
          spawnPickupBurst(p.mesh.position.x, p.mesh.position.y, p.mesh.position.z, MAT.brick);
        }
        setBricksUI(bricks);
        sfx.pickup();
      }
  }
}
// v4 道具门：扫掠判定过门（不扣砖），+N 加砖 / ×N 乘砖（母本 botRun 同口径）
function checkGates(prevZ, z) {
  if (!level.gates) return;
  for (const g of level.gates) {
    if (g.used) continue;
    if (z >= g.z && prevZ < g.z) {

      pickupPulse = 1.0; if (g.type === 'add') { bricks += g.v; floatText(`+${g.v} 砖`, '#64b5f6'); }
      else { bricks *= g.v; floatText(`×${g.v} 砖`, '#ff8a80'); }

      sfx.pickup();
      console.log(`[ShortcutRun] 道具门 ${g.type === 'add' ? '+' + g.v : '×' + g.v}，现有 ${bricks} 砖`);
    }
  }
}
// （v3 起：断崖自动扣费桥已废弃，改为持续自由铺板机制，见下方 updateShortcut）
window.addEventListener('error', (e) => {

  d.textContent = '运行错误: ' + (e.message || e.type);
  d.style.cssText = 'position:fixed;left:8px;bottom:8px;right:8px;background:#c62828;color:#fff;font:13px monospace;padding:10px;border-radius:8px;z-index:99;white-space:pre-wrap;';
  document.body.appendChild(d);
});
// ===== 自由铺板捷径（原版 Shortcut Run 核心机制） =====
// 规则：脚在主路上（半宽内且非缺口）= 免费；离开主路即进入铺板模式——
// 每前进 1 米消耗 plankCostPerMeter 块板，脚下持续生成板子（视觉轨迹），
// 并获得 offRoadBoost 加速（赌板子换速度，原版铺捷径加速）；板子耗尽时
// 有 leapGrace 米的最后一跃，落到主路上则生还，否则坠落。
const plankMat = new THREE.MeshLambertMaterial({ color: 0xb08968 });
const planks = [];               // 已铺板子（含池）
let plankCursor = 0;               // 池 round-robin
let plankAcc = 0;                  // 累计铺板距离（米）
let offRoad = false;               // 当前是否在主路外
let leapGrace = 0;                 // 剩余最后一跃距离（米），>0 表示飞跃中不耗板
let inGapZone = false;             // 主路缺口提示（供 UI/音效）

function isOnMainRoad(x, z) {
  if (z >= level.gateZ - 0.5) return true;
  const half = cfg.trackHalfWidth;
  if (Math.abs(x - bendX(z)) > half) return false;
  for (const g of level.gaps) if (z >= g.zStart - 0.15 && z <= g.zEnd + 0.15) return false;
  return true;
}

function updateShortcut(x, z, adv) {
  const onRoad = isOnMainRoad(x, z);
  // 主路缺口提示（音效/UI 用）
  const inGap = !onRoad && level.gaps.some((g) => z >= g.zStart - 0.15 && z <= g.zEnd + 0.15);
  if (inGap !== inGapZone) inGapZone = inGap;

  // 最后一跃：优先于 onRoad 清零（否则 leapGrace 被立即清掉永坠不了）
  if (leapGrace > 0) {
    if (onRoad) { leapGrace = 0; offRoad = false; return; } // 落到主路=生还
    leapGrace -= adv;
    if (leapGrace <= 0) { enterFall(); return; }
    return;
  }

  if (onRoad) { offRoad = false; return; }

  // --- 铺板模式 ---
  if (!offRoad) {
    offRoad = true;
    plankAcc = 0;
    console.log('[ShortcutRun] 离开主路，开始铺板捷径');
    sfx.bridge();
  }
  bridgeT = 0.25; // 铺板推掷动作窗（v2 增强）
  shake(0.05, 0.1);

  if (bricks <= 0) { leapGrace = 1.2; return; } // 触发最后一跃

  plankAcc += adv;
  const cost = cfg.plankCostPerMeter * adv;
  bricks = Math.max(0, bricks - cost);
  setBricksUI(Math.floor(bricks));

  // 每 plankStride 米在脚下留一块板（未满池时新增，满后循环复用最老的）
  if (plankAcc >= cfg.plankStride) {
    plankAcc = 0;
    layPlank(z, x);
  }
}

// 在 (x,z) 留一块板（玩家与 AI 对手共用）
function layPlank(z, x) {
  const h = headingAt(z);
  const px = bendX(z) + x * Math.cos(h) + (Math.random() - 0.5) * 0.15;
  let plank;
  if (planks.length < cfg.plankPoolMax) {
    plank = new THREE.Mesh(BOX, plankMat);
    plank.scale.set(1.5, 0.1, cfg.plankStride * 0.95);
    scene.add(plank);
    planks.push(plank);
  } else {
    plank = planks[plankCursor];
    plankCursor = (plankCursor + 1) % cfg.plankPoolMax;
  }
  plank.position.set(px, 0.02, z - 0.2);
  plank.rotation.y = h;
}

function checkGate(z) {
  if (z >= level.gateZ - 0.5) win(); // 原版规则：到达终点即过关（星级按用时/余砖）
}

// ===== AI 对手竞速（原版标志性机制复刻） =====
// 规则：N 个 AI 对手同时起跑，各自带板铺捷径；速度比玩家快的撞飞玩家（抢板），
// 玩家比对手快的撞飞对手并没收其携带板子；断崖/板尽同样会坠落。
const OPPONENT_COUNT = 3;
const opponents = [];

function buildOpponents() {
  for (const o of opponents) scene.remove(o.rig);
  opponents.length = 0;
  for (let i = 0; i < OPPONENT_COUNT; i++) {
    const rig = char.root.clone(); // 深拷贝角色（共享几何体/克隆材质）
    rig.traverse((n) => {
      if (n.isMesh && n.material) {
        n.material = n.material.clone();
        n.material.color.offsetHSL(0.09 * (i + 1), 0, -0.12 - i * 0.05);
      }
    });
    const x = (i - (OPPONENT_COUNT - 1) / 2) * 1.1;
    const z = -1.2 - i * 1.0;
    rig.position.set(bendX(z) + x, 0, z);
    rig.rotation.y = headingAt(z);
    scene.add(rig);
    opponents.push({
      rig, x, z,
      speed: cfg.runSpeed * (0.9 + i * 0.05),
      bricks: 24,
      alive: true, finished: false,
      targetX: x, changeT: Math.random() * 2, runCycle: i * 2.1,
    });
  }
}

function rigOf(root) {
  const g = (n) => root.getObjectByName(n);
  return {
    root,
    torso: g('Torso'), head: g('Head'), headbandRibbon: g('Ribbon'),
    leftArm: { shoulder: g('ShoulderL'), elbow: g('ElbowL') },
    rightArm: { shoulder: g('ShoulderR'), elbow: g('ElbowR') },
    leftLeg: { hip: g('HipL'), knee: g('KneeL'), foot: g('FootL') },
    rightLeg: { hip: g('HipR'), knee: g('KneeR'), foot: g('FootR') },
    plankMount: g('PlankMount'),
  };
}

function updateOpponents(dt) {
  for (const o of opponents) {
    if (!o.alive || o.finished) continue;
    o.changeT -= dt;
    if (o.changeT <= 0) {
      o.changeT = 1.2 + Math.random() * 2;
      // 80% 沿主路跑，20% 尝试切弯抄近路
      o.targetX = Math.random() < 0.8
        ? (Math.random() * 2 - 1) * cfg.trackHalfWidth * 0.7
        : (Math.random() * 2 - 1) * (cfg.trackHalfWidth + 2.2);
    }
    o.x += (o.targetX - o.x) * Math.min(1, dt * 2.2);
    const adv = o.speed * dt;
    o.z += adv;

    // 铺板经济：离开主路持续耗板，板尽坠落
    if (!isOnMainRoad(o.x, o.z)) {
      if (o.bricks > 0) {
        o.bricks -= cfg.plankCostPerMeter * adv;
        if (Math.random() < adv / cfg.plankStride) layPlank(o.z, o.x);
      } else { knockOut(o, ' opponents 板尽坠落'); continue; }
    }

    // 与玩家碰撞：快者撞飞慢者并抢板
    if (state === 'run' && Math.abs(o.z - player.position.z) < 0.85 && Math.abs(o.x - playerX) < 0.85) {
      if (speed > o.speed * 1.02) {
        knockOut(o, ' 被你撞飞');
        const loot = Math.min(Math.floor(o.bricks), 6);
        if (loot > 0) { bricks += loot; pickupPulse = 1.0; setBricksUI(Math.floor(bricks)); floatText(`抢板 +${loot}`, '#ff8a80'); }
      } else if (o.speed > speed * 1.02) {
        knockOut(o, ' 对手撞飞了你'); // 对手继续跑
        enterFall();
        return;
      }
    }

    if (o.z >= level.gateZ - 0.5) { o.finished = true; continue; }

    o.rig.position.set(bendX(o.z) + o.x * Math.cos(headingAt(o.z)), 0, o.z);
    o.rig.rotation.y = headingAt(o.z);
    o.runCycle += dt * (8 + o.speed * 0.7);
    animateChar(rigOf(o.rig), o.runCycle, o.targetX - o.x, Math.ceil(o.bricks), 'running', dt);
  }
}

function knockOut(o, why) {
  o.alive = false;
  console.log('[ShortcutRun] 对手退场:' + why);
  sfx.lose();
  shake(0.12, 0.2);
  const p = o.rig.position;
  tweenTo(o.rig.position, 'y', p.y - 6, 0.8);
}

// ============ 主循环 ============
const clock = new THREE.Clock();
let elapsed = 0;
let slowT = 0; // 失败慢动作剩余时间
function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta();
  updateParticles(raw);
  if (slowT > 0) slowT -= raw;
  const dt = Math.min(raw * (slowT > 0 ? 0.35 : 1), 0.05);
  elapsed += dt;
  stepAnims(dt);

  if (state === 'run' || state === 'fall' || state === 'win' || state === 'lose') {
    if (heldLeft) targetX += cfg.keySteerSpeed * dt;   // 屏幕左 = 世界 +X（手性修正）
    if (heldRight) targetX -= cfg.keySteerSpeed * dt;
    clampTarget();

    const prevZ = player.position.z;
    let z = prevZ;
    let x = playerX; // 逻辑横坐标（非世界 x；世界 x 含 bendX，回读会正反馈甩飞）

    if (state === 'run') {
      if (shoeT > 0) shoeT -= dt;
      if (speedDip > 0) speedDip -= dt;
      if (bridgeT > 0) bridgeT -= dt;
      speed = Math.min(cfg.maxSpeed, cfg.runSpeed + bricks * cfg.speedPerBrick) * (shoeT > 0 ? 1.35 : 1) * (offRoad ? cfg.offRoadBoost : 1);
      const adv = speed * dt; // 本帧前进距离（米）
      z += adv;
      const k = 1 - Math.exp(-cfg.steerSpeed * dt);
      x += (targetX - x) * k;
      playerY = 0;
      updateShortcut(x, z, adv); // 自由铺板核心：离开主路即脚下耗板铺路
    } else if (state === 'fall') {
      fallVel += 22 * dt;
      playerY -= fallVel * dt;
      if (playerY < -8) { lose('掉落！'); }
    }
    playerX = x;

    player.position.set(bendX(z) + x * Math.cos(headingAt(z)), playerY, z); // 根节点在脚底，随弯道
    player.rotation.y = headingAt(z); // 朝向=切线
    if (state === 'run') runCycle += dt * (8 + speed * 0.7); // 步频随速度
    const charState = state === 'ready' ? 'idle'
      : state === 'run' ? (bridgeT > 0 ? 'bridging' : 'running')
      : state === 'fall' ? 'drowned'
      : state === 'win' ? 'finished'
      : (fell ? 'drowned' : 'idle'); // lose：掉下去的旋水，够砖差一步的站着
    pickupPulse = Math.max(0, pickupPulse - dt * 2.2);
    animateChar(char, runCycle, targetX - x, bricks, charState, dt, pickupPulse);

    if (state === 'run') {
      checkPickups(x, prevZ, z);
      checkGates(prevZ, z);
      checkGate(z);
    }
    updateOpponents(dt);
    // 砖堆挂 plankMount（头顶），只需切可见性
    for (let i = 0; i < stackMeshes.length; i++) {
      stackMeshes[i].visible = i < Math.min(bricks, stackMeshes.length);
    }
    setProgressUI(z, level.gateZ);
  } else if (state === 'ready') {
    // 待机轻浮动
    player.position.y = Math.sin(elapsed * 3) * 0.03;
    player.position.x = bendX(0) + playerX * Math.cos(headingAt(0));
    player.rotation.y = headingAt(0);
    animateChar(char, 0, 0, 0, 'idle', dt);
  }

  // 相机跟随（锚在弯道路径上：身后一点沿路径中心线 + 逻辑侧向×xFactor）
  const t = player.position;
  const camAnchorZ = t.z + cfg.camOffsetZ;
  const dx = bendX(camAnchorZ) + playerX * cfg.camXFactor;
  const dy = Math.max(t.y, 0) * 0.35 + cfg.camOffsetY;
  const dz = camAnchorZ;
  if (!camInited) { camera.position.set(dx, dy, dz); camInited = true; }
  else {
    const k = 1 - Math.exp(-cfg.camLerp * dt);
    camera.position.x += (dx - camera.position.x) * k;
    camera.position.y += (dy - camera.position.y) * k;
    camera.position.z += (dz - camera.position.z) * k;
  }
  camera.lookAt(t.x, t.y + 1.05, t.z); // 略高于胸，俯视追尾（胸前砖垛可见）

  // 铺桥/掉落实感：震屏衰减
  if (shakeT > 0) {
    shakeT -= dt;
    const m = shakeMag * Math.max(0, shakeT / 0.25);
    camera.position.x += (Math.random() - 0.5) * m;
    camera.position.y += (Math.random() - 0.5) * m;
  }
  // 速度感：FOV 随速度冲刺（56 → 64）
  const sp = Math.max(0, Math.min(1, (speed - cfg.runSpeed) / Math.max(0.1, cfg.maxSpeed - cfg.runSpeed)));
  const targetFov = 56 + sp * 8;
  if (Math.abs(camera.fov - targetFov) > 0.15) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, 4 * dt);
    camera.updateProjectionMatrix();
  }

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 开始界面：按钮或任意位置点击均可开始
document.getElementById('startBtn').addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
startScreen.addEventListener('click', startGame);

syncLevel(); // 跨重启续档：从存档的 (level, attempt) 进场
loop();

// ============ 调试接口（供自动化验证用） ============
window.__game = {
  getState: () => ({
    state, bricks, x: playerX, y: player.position.y, z: player.position.z, speed,
    pickups: pickups.length, gaps: level.gaps.length, gateZ: level.gateZ,
    level: levelNum, theme: themeKey, themeName: THEMES[themeKey].name, sky: THEMES[themeKey].sky,
    playerColor: THEMES[themeKey].player, shoeT,
    pickupList: pickups.map((p) => ({ x: p.def.x, z: p.def.z, taken: p.taken, kind: p.def.kind || 'brick' })),
    gapList: level.gaps.map((g) => ({ zStart: g.zStart, zEnd: g.zEnd, cost: g.cost, bridged: !!g.bridged })),
    offRoad, planksLaid: planks.length,
    opponents: opponents.filter((o) => o.alive).length,
    opponentsDone: opponents.filter((o) => o.finished || !o.alive).length,
    gateList: (level.gates || []).map((g) => ({ z: g.z, type: g.type, v: g.v, used: !!g.used })),
  }),
  setBricks: (n) => { bricks = n; setBricksUI(n); },
  setTheme: (k) => { if (THEMES[k]) { themeKey = k; applyTheme(); } },
  setPlayerColor: (hex) => { MAT.player.color.setHex(hex); CHAR_MATS.clothTop.color.setHex(hex); }, // QA 用：像素检测 marker 色（新角色用 clothTop）
  getSkin: () => currentSkinKey,
  setSkin: (k) => { if (SKINS[k]) { currentSkinKey = k; applySkin(char, k); } },
  skinList: () => Object.keys(SKINS),
  restart: (lv) => {
    qaSession = true; // QA 后门局：后续 pushEvent 带 qa:true，避免污染真人统计
    prog.reset();
    for (let i = 1; i < (lv || 1); i++) prog.win(999, 0); // 快进到指定关（QA 用）
    syncLevel();
  },
  progress: () => prog.state(),
  resetProgress: () => { qaSession = true; prog.reset(); },
  renderOnce: () => renderer.render(scene, camera),
  canvas: () => renderer.domElement,
  // QA 调试：列出玩家身边贴地/可疑物体（定位“躺在地上跟随的”是什么）
  debugGround: () => {
    const out = [];
    const p = player.position;
    scene.traverse((n) => {
      if (!n.isMesh && !n.isGroup) return;
      const wp = n.getWorldPosition(new (Object.getPrototypeOf(p).constructor)());
      const dx = wp.x - p.x, dz = wp.z - p.z;
      if (dx * dx + dz * dz > 144) return; // 12m 内
      const kind = n.name || n.type;
      out.push({ kind, name: n.name || '(anon)', y: Math.round(wp.y * 100) / 100, dx: Math.round(dx * 10) / 10, dz: Math.round(dz * 10) / 10, parent: n.parent ? (n.parent.name || n.parent.type) : '-' });
    });
    return out.filter((o) => o.y < 0.6).slice(0, 30);
  },
  // QA 调试：对手运行时姿态（关节是否找到、位置、动画相位）
  debugOpponents: () => opponents.map((o) => {
    const r = rigOf(o.rig);
    const missing = [];
    if (!r.torso) missing.push('torso');
    if (!r.head) missing.push('head');
    if (!r.leftLeg || !r.leftLeg.hip) missing.push('leftLeg.hip');
    if (!r.rightLeg || !r.rightLeg.hip) missing.push('rightLeg.hip');
    if (!r.leftArm || !r.leftArm.shoulder) missing.push('leftArm.shoulder');
    if (!r.rightArm || !r.rightArm.shoulder) missing.push('rightArm.shoulder');
    return {
      pos: [Math.round(o.rig.position.x * 100) / 100, Math.round(o.rig.position.y * 100) / 100, Math.round(o.rig.position.z * 100) / 100],
      alive: o.alive, finished: o.finished, bricks: Math.round(o.bricks),
      hipAngleX: r.leftLeg && r.leftLeg.hip ? Math.round(r.leftLeg.hip.rotation.x * 100) / 100 : null,
      torsoY: r.torso ? Math.round(r.torso.position.y * 100) / 100 : null,
      missing,
    };
  }),
  // G1 数据回流：导出遥测 events.json（Qoder telemetry-report.mjs 的输入）
  dumpTelemetry: () => {
    const arr = JSON.parse(localStorage.getItem(TELEMETRY_KEY) || '[]');
    const blob = new Blob([JSON.stringify(arr)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'events.json';
    a.click();
    return arr.length;
  },
};
</script>
</body>
