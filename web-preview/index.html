<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ShortcutRun 灰模 · 浏览器试玩版</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87a5c8; font-family: "Microsoft YaHei", sans-serif; }
  #app { width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 50%; transform: translateX(-50%); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5); user-select: none; pointer-events: none; }
  #brick { top: 18px; font-size: 28px; font-weight: bold; }
  #hint { top: 44%; font-size: 34px; font-weight: bold; text-align: center; }
  #title { position: fixed; left: 14px; top: 12px; color: #fff; font-size: 14px; opacity: .85; text-shadow: 0 1px 4px rgba(0,0,0,.5); user-select: none; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="title">ShortcutRun 灰模 · 拖动鼠标 / A D 转向</div>
<div id="brick" class="hud">砖块 0</div>
<div id="hint" class="hud">点击开始 · 终点需 14 砖</div>
<script src="three.min.js"></script>
<script>
// ============ 配置（与 Cocos 版 config.ts 一致） ============
const CFG = {
  runSpeed: 6, speedPerBrick: 0.08, maxSpeed: 10,
  steerSpeed: 10, steerPerPixel: 0.022, keySteerSpeed: 4,
  trackHalfWidth: 2.6,
  levelLength: 150, gapWidthMin: 2.5, gapWidthMax: 4.5,
  gapIntervalMin: 16, gapIntervalMax: 26,
  brickCluster: 4, gateCost: 14, brickUnit: 0.3,
  camOffsetY: 5.2, camOffsetZ: -7.5, camLerp: 6, camXFactor: 0.6,
};

// ============ 关卡生成（与 Cocos 版 LevelGen.ts 一致，纯逻辑） ============
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function genLevel(seed, cfg) {
  const rnd = mulberry32(seed);
  const halfW = cfg.trackHalfWidth - 0.8;
  const gaps = [];
  let z = 8;
  while (z < cfg.levelLength - 14) {
    const width = cfg.gapWidthMin + rnd() * (cfg.gapWidthMax - cfg.gapWidthMin);
    gaps.push({ zStart: z, zEnd: z + width, cost: Math.ceil(width) });
    z = z + width + cfg.gapIntervalMin + rnd() * (cfg.gapIntervalMax - cfg.gapIntervalMin);
  }
  const gateZ = cfg.levelLength - 6;
  const runZones = [];
  let prev = 0;
  for (const g of gaps) { runZones.push([prev, g.zStart]); prev = g.zEnd; }
  runZones.push([prev, gateZ - 2]);
  const pickups = [];
  for (const [z0, z1] of runZones) {
    if (z1 - z0 < 6) continue;
    const n = 1 + (rnd() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) pickups.push({ x: (rnd() * 2 - 1) * halfW, z: z0 + 2 + rnd() * Math.max(1, z1 - z0 - 4) });
  }
  const need = cfg.gateCost + gaps.reduce((s, g) => s + g.cost, 0);
  while (pickups.length * cfg.brickCluster < need) {
    const zone = runZones[Math.floor(rnd() * runZones.length)];
    if (!zone || zone[1] - zone[0] < 6) break;
    pickups.push({ x: (rnd() * 2 - 1) * halfW, z: zone[0] + 2 + rnd() * Math.max(1, zone[1] - zone[0] - 4) });
  }
  return { length: cfg.levelLength, gaps, pickups, gateZ, gateCost: cfg.gateCost };
}

// ============ 三维场景 ============
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a5c8);
scene.fog = new THREE.Fog(0x87a5c8, 40, 170);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(8, 20, 6);
scene.add(sun);

const BOX = new THREE.BoxGeometry(1, 1, 1);
const MAT = {
  road:   new THREE.MeshLambertMaterial({ color: 0x9aa2ab }),
  ground: new THREE.MeshLambertMaterial({ color: 0x5b7a5e }),
  brick:  new THREE.MeshLambertMaterial({ color: 0xffd54f }),
  bridge: new THREE.MeshLambertMaterial({ color: 0xb08968 }),
  player: new THREE.MeshLambertMaterial({ color: 0x4fc3f7 }),
  gate:   new THREE.MeshLambertMaterial({ color: 0xef5350 }),
  pillar: new THREE.MeshLambertMaterial({ color: 0x546e7a }),
};

function box(mat, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}

// ============ 游戏状态 ============
let level, state = 'ready', bricks = 0, speed = CFG.runSpeed;
let playerX = 0, targetX = 0, playerY = 0, fallVel = 0;
let pickups = [], gateWalls = [], stackMeshes = [], anims = [];
let camInited = false;
const player = box(MAT.player, 0.7, 1.5, 0.7, 0, 0.75, 0);
for (let i = 0; i < 12; i++) {
  const s = CFG.brickUnit * 0.85;
  const m = box(MAT.brick, s, s, s, 0, s / 2, -0.6 - i * s * 1.15);
  m.visible = false;
  stackMeshes.push(m);
}

function buildLevel(seed) {
  level = genLevel(seed, CFG);
  // 清掉上一局动态物体（保留 player / stack / 灯光）
  for (let i = scene.children.length - 1; i >= 0; i--) {
    const o = scene.children[i];
    if (o.geometry === BOX && o !== player && !stackMeshes.includes(o)) scene.remove(o);
  }
  // 地面
  box(MAT.ground, 60, 0.4, CFG.levelLength + 80, 0, -0.6, CFG.levelLength / 2 - 10);

  pickups = []; gateWalls = []; anims = [];
  const w = CFG.trackHalfWidth * 2 + 0.6;
  // 跑道（按断崖分段）
  let z = 0;
  for (const g of level.gaps) { road(z, g.zStart, w); z = g.zEnd; }
  road(z, level.gateZ, w);
  // 拾取
  for (const p of level.pickups) {
    const s = CFG.brickUnit;
    const m = box(MAT.brick, s, s, s, p.x, s / 2 + 0.05, p.z);
    pickups.push({ mesh: m, def: p, taken: false });
  }
  // 终点门
  const wallW = (CFG.trackHalfWidth * 2) / 3;
  for (let i = -1; i <= 1; i++) gateWalls.push(box(MAT.gate, wallW, 1.4, 0.4, i * wallW, 0.7, level.gateZ));
  for (const sx of [-1, 1]) box(MAT.pillar, 0.5, 2.8, 0.5, sx * (CFG.trackHalfWidth + 0.35), 1.4, level.gateZ);

  // 玩家与状态复位（原地重建必须显式重置，否则从旧位置起步）
  state = 'ready'; bricks = 0; speed = CFG.runSpeed;
  playerX = 0; targetX = 0; playerY = 0; fallVel = 0;
  heldLeft = false; heldRight = false; dragging = false;
  player.position.set(0, 0.75, 0);
  player.rotation.set(0.05, 0, 0);
  for (const m of stackMeshes) m.visible = false;
  camInited = false;
  setBricksUI(0);
  showHint('点击开始 · 终点需 ' + CFG.gateCost + ' 砖');
  console.log(`[ShortcutRun] 关卡 seed=${seed} 断崖=${level.gaps.length} 拾取=${level.pickups.length} 终点z=${level.gateZ.toFixed(1)} 门需求=${CFG.gateCost}`);
}
function road(z0, z1, w) {
  const len = z1 - z0;
  if (len <= 0.1) return;
  box(MAT.road, w, 0.4, len, 0, -0.2, (z0 + z1) / 2);
}

// ============ 输入 ============
let dragging = false, dragLastX = 0, heldLeft = false, heldRight = false;
addEventListener('pointerdown', (e) => {
  startRun();
  dragging = true; dragLastX = e.clientX;
});
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  // Three.js 右手系 + 相机看向 +Z ⇒ 屏幕右 = 世界 -X（与 Cocos 左手系相反，须取反）
  targetX -= (e.clientX - dragLastX) * CFG.steerPerPixel;
  dragLastX = e.clientX;
  clampTarget();
});
addEventListener('pointerup', () => { dragging = false; });
addEventListener('keydown', (e) => {
  startRun();
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') heldLeft = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') heldRight = true;
});
addEventListener('keyup', (e) => {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') heldLeft = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') heldRight = false;
});
function clampTarget() { const m = CFG.trackHalfWidth - 0.45; targetX = Math.max(-m, Math.min(m, targetX)); }

// ============ HUD ============
const brickEl = document.getElementById('brick');
const hintEl = document.getElementById('hint');
function setBricksUI(n) { brickEl.textContent = '砖块 ' + n; }
function showHint(t) { hintEl.textContent = t; hintEl.style.display = 'block'; }
function hideHint() { hintEl.style.display = 'none'; }

// ============ 动画（极简 tween） ============
function tweenTo(obj, prop, to, dur, onDone) { anims.push({ obj, prop, from: obj[prop], to, t: 0, dur, onDone }); }
function stepAnims(dt) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i];
    a.t += dt;
    const k = Math.min(1, a.t / a.dur);
    a.obj[a.prop] = a.from + (a.to - a.from) * k;
    if (k >= 1) { anims.splice(i, 1); a.onDone && a.onDone(); }
  }
}

// ============ 核心逻辑（与 Cocos 版 GameApp.ts 一致，含扫掠检测） ============
function startRun() {
  if (state === 'ready') { state = 'run'; hideHint(); console.log('[ShortcutRun] GO!'); }
}
function enterFall() {
  console.log('[ShortcutRun] 砖不够，掉落！');
  showHint('掉落！');
  state = 'fall'; fallVel = 1;
}
function win() {
  state = 'win';
  showHint('胜利！');
  for (const w of gateWalls) tweenTo(w.position, 'y', -2.2, 0.4);
  const y0 = player.position.y;
  tweenTo(player.position, 'y', y0 + 0.7, 0.25, () => tweenTo(player.position, 'y', y0, 0.25));
  console.log('[ShortcutRun] WIN! 1.6 秒后重开');
  setTimeout(() => buildLevel(Math.floor(Math.random() * 999) + 1), 1600);
}
function lose(reason) {
  if (state === 'lose') return;
  state = 'lose';
  showHint(reason);
  console.log('[ShortcutRun] LOSE: ' + reason + '. 1.6 秒后重开');
  setTimeout(() => buildLevel(Math.floor(Math.random() * 999) + 1), 1600);
}
function checkPickups(x, prevZ, z) {
  for (const p of pickups) {
    if (p.taken) continue;
    const hitZ = z >= p.def.z - 0.7 && prevZ <= p.def.z + 0.7;
    if (hitZ && Math.abs(x - p.def.x) < 0.95) {
      p.taken = true;
      p.mesh.visible = false;
      bricks += CFG.brickCluster;
      setBricksUI(bricks);
    }
  }
}
function checkGaps(prevZ, z) {
  for (const g of level.gaps) {
    if (g.bridged) continue;
    if (z >= g.zStart && prevZ < g.zEnd + 0.5) {
      if (bricks >= g.cost) {
        bricks -= g.cost;
        g.bridged = true;
        setBricksUI(bricks);
        const w = CFG.trackHalfWidth * 2 + 0.6;
        const b = box(MAT.bridge, w, 0.4, g.zEnd - g.zStart, 0, 4, (g.zStart + g.zEnd) / 2);
        tweenTo(b.position, 'y', -0.2, 0.25);
        console.log(`[ShortcutRun] 铺桥 -${g.cost} 砖，剩余 ${bricks}`);
      } else {
        enterFall();
      }
      return;
    }
  }
}
function checkGate(z) {
  if (z >= level.gateZ - 0.5) {
    if (bricks >= CFG.gateCost) win();
    else lose(`终点砖不够 ${bricks}/${CFG.gateCost}`);
  }
}

// ============ 主循环 ============
const clock = new THREE.Clock();
let elapsed = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  stepAnims(dt);

  if (state === 'run' || state === 'fall') {
    if (heldLeft) targetX += CFG.keySteerSpeed * dt;   // 屏幕左 = 世界 +X（手性修正）
    if (heldRight) targetX -= CFG.keySteerSpeed * dt;
    clampTarget();

    const prevZ = player.position.z;
    let z = prevZ, x = player.position.x;

    if (state === 'run') {
      speed = Math.min(CFG.maxSpeed, CFG.runSpeed + bricks * CFG.speedPerBrick);
      z += speed * dt;
      const k = 1 - Math.exp(-CFG.steerSpeed * dt);
      x += (targetX - x) * k;
      playerY = 0;
    } else if (state === 'fall') {
      fallVel += 22 * dt;
      playerY -= fallVel * dt;
      if (playerY < -8) { lose('掉落！'); }
    }

    player.position.set(x, playerY + 0.75, z);
    const tilt = Math.max(-0.35, Math.min(0.35, (targetX - x) * 0.25));
    player.rotation.set(state === 'fall' ? -0.9 : 0.05, 0, -tilt);

    if (state === 'run') {
      checkPickups(x, prevZ, z);
      checkGaps(prevZ, z);
      checkGate(z);
    }
    // 砖堆跟随
    for (let i = 0; i < stackMeshes.length; i++) {
      stackMeshes[i].visible = i < Math.min(bricks, stackMeshes.length);
      if (stackMeshes[i].visible) {
        const s = CFG.brickUnit * 0.85;
        stackMeshes[i].position.set(x, s / 2, z - 0.6 - i * s * 1.15);
      }
    }
  } else if (state === 'ready') {
    // 待机轻浮动
    player.position.y = 0.75 + Math.sin(elapsed * 3) * 0.05;
  }

  // 相机跟随（与 Cocos 版 CameraFollow 一致）
  const t = player.position;
  const dx = t.x * CFG.camXFactor;
  const dy = Math.max(t.y, 0) * 0.35 + CFG.camOffsetY;
  const dz = t.z + CFG.camOffsetZ;
  if (!camInited) { camera.position.set(dx, dy, dz); camInited = true; }
  else {
    const k = 1 - Math.exp(-CFG.camLerp * dt);
    camera.position.x += (dx - camera.position.x) * k;
    camera.position.y += (dy - camera.position.y) * k;
    camera.position.z += (dz - camera.position.z) * k;
  }
  camera.lookAt(t.x, t.y + 0.8, t.z);

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

buildLevel(1);
loop();

// ============ 调试接口（供自动化验证用） ============
window.__game = {
  getState: () => ({
    state, bricks, x: player.position.x, y: player.position.y, z: player.position.z, speed,
    pickups: pickups.length, gaps: level.gaps.length, gateZ: level.gateZ,
    pickupList: pickups.map((p) => ({ x: p.def.x, z: p.def.z, taken: p.taken })),
    gapList: level.gaps.map((g) => ({ zStart: g.zStart, zEnd: g.zEnd, cost: g.cost, bridged: !!g.bridged })),
  }),
  setBricks: (n) => { bricks = n; setBricksUI(n); },
  restart: (seed) => buildLevel(seed || 1),
  renderOnce: () => renderer.render(scene, camera),
  canvas: () => renderer.domElement,
};
</script>
</body>
</html>
